name: Dependency preflight

on:
  push:
    branches:
      - feature/versioned-dependency-audit

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/artaround_dependency_preflight
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: preflight-only-stable-secret-for-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies from committed lockfile
        run: npm ci

      - name: Install Navigator dependencies
        run: npm install --prefix clients/navigator --no-audit --no-fund

      - name: Start standalone MongoDB
        run: |
          docker run --detach --name artaround-preflight-mongo --publish 27017:27017 mongo:7 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec artaround-preflight-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 1
          done

      - name: Run dedicated dependency tests
        run: node -r ./config/testMongoEnvironment.js -r ./config/mongoUnitOfWork.js --test --test-concurrency=1 tests/versionedSchemaDependency.test.js tests/schemaDependencyAuditMongo.test.js tests/versionedDependencyAuthoringMongo.test.js

      - name: Check backend contracts and static hygiene
        run: npm run check

      - name: Check and build clients
        run: npm run check:clients && npm run build:clients

      - name: Stop preflight MongoDB
        if: always()
        run: docker rm --force artaround-preflight-mongo || true

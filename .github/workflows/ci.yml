name: CI

on:
  push:
    branches:
      - main
      - user-visit
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/artaround_ci
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: ci-only-stable-secret-for-tests

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies from committed lockfile
        run: npm ci

      - name: Install Navigator dependencies
        run: npm install --prefix clients/navigator --no-audit --no-fund

      - name: Check backend contracts and repository hygiene
        run: npm run check

      - name: Check and build clients
        run: npm run check:clients && npm run build:clients

      - name: Run unit and MongoDB compatibility tests
        run: npm test

      - name: Audit production backend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Navigator dependencies
        run: npm audit --prefix clients/navigator --audit-level=high

name: CI

on:
  push:
    branches:
      - main
      - user-visit
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/artaround_ci
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: ci-only-stable-secret-for-tests

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/user-visit' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dependency lock [skip ci]"
            git push origin HEAD:user-visit
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax, legacy contracts and repository hygiene
        run: npm run check

      - name: Run unit and MongoDB compatibility tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

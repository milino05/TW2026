name: CI

on:
  push:
    branches:
      - main
      - user-visit
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/artaround_ci
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: ci-only-stable-secret-for-tests

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11.10.1 for lockfile normalization
        run: npm install --global npm@11.10.1

      - name: Normalize package lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json

      - name: Commit normalized lockfile when needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/user-visit'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize production dependency lockfile"
          git push

      - name: Install dependencies from normalized lockfile
        run: npm ci

      - name: Check JavaScript syntax, legacy contracts and repository hygiene
        run: npm run check

      - name: Run unit and MongoDB compatibility tests
        run: npm test

      - name: Verify resolved production dependency tree
        run: npm ls express qs --all

      - name: Capture production audit report
        run: npm audit --omit=dev --json > npm-audit.json || true

      - name: Upload production audit report
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-report
          path: npm-audit.json
          if-no-files-found: error

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

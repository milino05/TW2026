name: CI

on:
  push:
    branches:
      - main
      - user-visit
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/artaround_ci
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: ci-only-stable-secret-for-tests

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11.10.1 for lockfile normalization
        run: npm install --global npm@11.10.1

      - name: Generate candidate normalized lockfile
        run: |
          cp package-lock.json package-lock.before.json
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json

      - name: Upload candidate normalized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Restore committed lockfile for validation
        run: mv package-lock.before.json package-lock.json

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Check JavaScript syntax, legacy contracts and repository hygiene
        run: npm run check

      - name: Run unit and MongoDB compatibility tests
        run: npm test

      - name: Verify resolved production dependency tree
        run: npm ls express qs --all

      - name: Diagnose production audit
        run: npm audit --omit=dev --json || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

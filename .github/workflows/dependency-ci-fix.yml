name: Dependency regression verification

on:
  push:
    branches:
      - tmp/versioned-dependency-ci-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/a
      NODE_ENV: test
      ADAPTIVE_CONTRIBUTOR_SECRET: dependency-fix-stable-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/versioned-dependency-ci-fix

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install Navigator dependencies
        run: npm install --prefix clients/navigator --no-audit --no-fund

      - name: Start standalone MongoDB
        run: |
          docker run --detach --name artaround-dependency-verify-mongo --publish 27017:27017 mongo:7 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec artaround-dependency-verify-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 1
          done

      - name: Re-run previously failing areas
        run: |
          node -r ./config/testMongoEnvironment.js -r ./config/mongoUnitOfWork.js --test --test-concurrency=1 \
            tests/auroraDatasetV2.test.js \
            tests/auroraNavigationV2.test.js \
            tests/examDatasetV2.test.js \
            tests/examPresentationMatrixMongo.test.js \
            tests/executionPreparationV2.test.js \
            tests/generationOptionsV2.test.js \
            tests/marketplaceItemAuthoringV2.test.js \
            tests/marketplaceVenueCreationUxContract.test.js \
            tests/navigationPreferencesSynchronizedV3.test.js \
            tests/navigationProjectionV2.test.js \
            tests/runtimeV2Mongo.test.js \
            tests/sessionPublicLocationV2.test.js \
            tests/venueCreationV2Mongo.test.js \
            tests/venueLayoutCommandV2Mongo.test.js \
            tests/venuePublicationVocabularyFeedback.test.js \
            tests/visitAuthoringPlaygroundSeed.test.js

      - name: Check backend contracts and repository hygiene
        run: npm run check

      - name: Check and build clients
        run: npm run check:clients && npm run build:clients

      - name: Run complete Node and Mongo test suite
        run: npm test

      - name: Stop MongoDB
        if: always()
        run: docker rm --force artaround-dependency-verify-mongo || true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pianta schematica ArtAround - Pinacoteca Nazionale di Bologna</title>
  <desc id="desc">Mappa didattica non ufficiale usata per la demo TW2026, con dodici tappe espositive, ingresso, uscita, informazioni, servizi, ascensore, scale, ristoro e bookshop.</desc>
  <rect width="1200" height="700" fill="#f7f7f4"/>
  <rect x="50" y="70" width="1100" height="520" rx="24" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <path d="M80 500 H1120" stroke="#777" stroke-width="18" stroke-linecap="round" opacity=".2"/>
  <path d="M100 475 C220 210 430 170 600 190 C780 210 980 300 1080 475" fill="none" stroke="#555" stroke-width="10" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">
    <text x="600" y="42" font-size="26" font-weight="700">Percorso demo ArtAround - pianta schematica non ufficiale</text>
    <g fill="#e8eef7" stroke="#24364b" stroke-width="3">
      <circle cx="170" cy="245" r="34"/><circle cx="310" cy="205" r="34"/><circle cx="455" cy="245" r="34"/>
      <circle cx="600" cy="205" r="34"/><circle cx="740" cy="245" r="34"/><circle cx="875" cy="315" r="34"/>
      <circle cx="810" cy="410" r="34"/><circle cx="665" cy="445" r="34"/><circle cx="520" cy="410" r="34"/>
      <circle cx="385" cy="445" r="34"/><circle cx="250" cy="410" r="34"/><circle cx="135" cy="365" r="34"/>
    </g>
    <g fill="#17202a" font-size="20" font-weight="700">
      <text x="170" y="252">1</text><text x="310" y="212">2</text><text x="455" y="252">3</text>
      <text x="600" y="212">4</text><text x="740" y="252">5</text><text x="875" y="322">6</text>
      <text x="810" y="417">7</text><text x="665" y="452">8</text><text x="520" y="417">9</text>
      <text x="385" y="452">10</text><text x="250" y="417">11</text><text x="135" y="372">12</text>
    </g>
    <g fill="#eef7ea" stroke="#31592b" stroke-width="3">
      <rect x="55" y="500" width="125" height="52" rx="10"/><rect x="190" y="500" width="110" height="52" rx="10"/>
      <rect x="310" y="500" width="110" height="52" rx="10"/><rect x="430" y="500" width="110" height="52" rx="10"/>
      <rect x="550" y="500" width="100" height="52" rx="10"/><rect x="660" y="500" width="105" height="52" rx="10"/>
      <rect x="775" y="500" width="120" height="52" rx="10"/><rect x="905" y="500" width="130" height="52" rx="10"/>
      <rect x="1045" y="500" width="100" height="52" rx="10"/>
    </g>
    <g fill="#20351e" font-size="15">
      <text x="117" y="531">Ingresso</text><text x="245" y="531">Info</text><text x="365" y="531">Servizi</text>
      <text x="485" y="531">Ascensore</text><text x="600" y="531">Scale</text><text x="712" y="531">Ristoro</text>
      <text x="835" y="531">Bookshop</text><text x="970" y="531">Percorso</text><text x="1095" y="531">Uscita</text>
    </g>
    <text x="600" y="615" font-size="18" fill="#444">I servizi sono collocati schematicamente per esercitare routing e comandi della demo.</text>
    <text x="600" y="650" font-size="17" fill="#555">Asset dimostrativo: non usare come planimetria o informazione operativa del museo.</text>
  </g>
</svg>

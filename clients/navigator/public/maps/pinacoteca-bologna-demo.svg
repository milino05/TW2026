<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pianta schematica ArtAround - Pinacoteca Nazionale di Bologna</title>
  <desc id="desc">Mappa didattica non ufficiale usata per la demo TW2026, con dodici tappe espositive e servizi.</desc>
  <rect width="1200" height="700" fill="#f7f7f4"/>
  <rect x="50" y="70" width="1100" height="520" rx="24" fill="#ffffff" stroke="#333" stroke-width="4"/>
  <path d="M80 520 H1120" stroke="#777" stroke-width="18" stroke-linecap="round" opacity=".2"/>
  <path d="M100 500 C220 210 430 170 600 190 C780 210 980 300 1080 500" fill="none" stroke="#555" stroke-width="10" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">

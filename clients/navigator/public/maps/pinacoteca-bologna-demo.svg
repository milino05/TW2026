      <text x="600" y="212">4</text><text x="740" y="252">5</text><text x="875" y="322">6</text>
      <text x="810" y="437">7</text><text x="665" y="472">8</text><text x="520" y="437">9</text>
      <text x="385" y="472">10</text><text x="250" y="437">11</text><text x="135" y="372">12</text>

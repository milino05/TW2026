services:
  mongo:
    image: mongo:7
    container_name: artaround-mongo
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init-replica:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok }'

  backend:
    build: .
    container_name: artaround-backend
    restart: always
    dns:
      - ${DOCKER_DNS:-1.1.1.1}
    ports:
      - "8000:8000"
    depends_on:
      mongo-init-replica:
        condition: service_completed_successfully
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/artaround?replicaSet=rs0}
      PORT: ${PORT:-8000}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADAPTIVE_CONTRIBUTOR_SECRET: ${ADAPTIVE_CONTRIBUTOR_SECRET:-development-only-change-me}
      WIKIDATA_API_URL: ${WIKIDATA_API_URL:-https://www.wikidata.org/w/api.php}
      WIKIMEDIA_COMMONS_API_URL: ${WIKIMEDIA_COMMONS_API_URL:-https://commons.wikimedia.org/w/api.php}
      WIKIDATA_USER_AGENT: ${WIKIDATA_USER_AGENT:-ArtAroundTW2026/1.0 (https://github.com/milino05/TW2026)}
      SEMANTIC_RESOLVER_TIMEOUT_MS: ${SEMANTIC_RESOLVER_TIMEOUT_MS:-5000}
      SEMANTIC_RESOLVER_RETRY_COUNT: ${SEMANTIC_RESOLVER_RETRY_COUNT:-1}
      SEMANTIC_RESOLVER_RETRY_BASE_MS: ${SEMANTIC_RESOLVER_RETRY_BASE_MS:-300}
      SEMANTIC_RESOLVER_MAX_AUTO_RETRY_AFTER_MS: ${SEMANTIC_RESOLVER_MAX_AUTO_RETRY_AFTER_MS:-2000}
      SEMANTIC_RESOLVER_CACHE_MAX_ENTRIES: ${SEMANTIC_RESOLVER_CACHE_MAX_ENTRIES:-300}
      SEMANTIC_RESOLVER_SEARCH_CACHE_TTL_MS: ${SEMANTIC_RESOLVER_SEARCH_CACHE_TTL_MS:-120000}
      SEMANTIC_RESOLVER_RESOLVE_CACHE_TTL_MS: ${SEMANTIC_RESOLVER_RESOLVE_CACHE_TTL_MS:-600000}
      NAVIGATOR_CONFIG_DIR: ${NAVIGATOR_CONFIG_DIR:-}
      ITEM_MEDIA_DIR: ${ITEM_MEDIA_DIR:-/app/uploads/item-media}
    volumes:
      - item-media:/app/uploads/item-media

volumes:
  mongo-data:
  item-media:
